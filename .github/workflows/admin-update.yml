name: Admin Update

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: "ping | publish | delete | clear | update_photos"
        required: true
        type: string
      text:
        description: "Update text (publish)"
        required: false
        type: string
        default: ""
      update_id:
        description: "Update id to remove (delete)"
        required: false
        type: string
        default: ""
      photos_json:
        description: "Full photos array as JSON (update_photos)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Ping (login check only)
        if: ${{ inputs.action_type == 'ping' }}
        run: echo "Token is valid for this repo. Nothing to do."

      - name: Checkout
        if: ${{ inputs.action_type != 'ping' }}
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Ensure data files exist
        if: ${{ inputs.action_type != 'ping' }}
        run: |
          mkdir -p data
          [ -f data/market-updates.json ] || echo "[]" > data/market-updates.json
          [ -f data/photos.json ] || echo "[]" > data/photos.json

      - name: Publish update
        if: ${{ inputs.action_type == 'publish' }}
        env:
          UPDATE_TEXT: ${{ inputs.text }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "data/market-updates.json";
            const list = JSON.parse(fs.readFileSync(path, "utf8"));
            const text = process.env.UPDATE_TEXT;
            if (!text || !text.trim()) { throw new Error("Empty update text."); }
            list.push({ id: "u-" + Date.now(), text: text.trim() });
            fs.writeFileSync(path, JSON.stringify(list, null, 2) + "\n");
          '

      - name: Delete update
        if: ${{ inputs.action_type == 'delete' }}
        env:
          UPDATE_ID: ${{ inputs.update_id }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "data/market-updates.json";
            const list = JSON.parse(fs.readFileSync(path, "utf8"));
            const id = process.env.UPDATE_ID;
            const next = list.filter(u => u.id !== id);
            fs.writeFileSync(path, JSON.stringify(next, null, 2) + "\n");
          '

      - name: Clear all updates
        if: ${{ inputs.action_type == 'clear' }}
        run: echo "[]" > data/market-updates.json

      - name: Update photo stack
        if: ${{ inputs.action_type == 'update_photos' }}
        env:
          PHOTOS_JSON: ${{ inputs.photos_json }}
        run: |
          node -e '
            const fs = require("fs");
            const raw = process.env.PHOTOS_JSON;
            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) { throw new Error("photos_json must be an array."); }
            fs.writeFileSync("data/photos.json", JSON.stringify(parsed, null, 2) + "\n");
          '

      - name: Commit and push
        if: ${{ inputs.action_type != 'ping' }}
        run: |
          git config user.name "market-admin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market-updates.json data/photos.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Admin update: ${{ inputs.action_type }}"
            git push
          fi
